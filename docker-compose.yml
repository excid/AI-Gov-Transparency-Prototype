services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      ML_SERVICE_URL: http://ml:8000
      NEXT_PUBLIC_ANALYSIS_URL: http://localhost:8000/analyze-tor
    depends_on:
      ml:
        condition: service_healthy
  ml:
    build: ./backend
    restart: unless-stopped
    mem_limit: 6g
    shm_size: 1gb
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LLM_MODEL: qwen3.8-flash
      TOR_MODEL_PATH: /app/data/models/tor-isolation-forest.joblib
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://ai-gov-transparency.johnseekan.chatgpt.site,http://localhost:3000,http://127.0.0.1:3000}
      MAX_CONCURRENT_ANALYSES: 1
      OMP_NUM_THREADS: 6
      MKL_NUM_THREADS: 6
      OCR_CACHE_ENTRIES: 8
    volumes:
      - paddle-models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  paddle-models:
