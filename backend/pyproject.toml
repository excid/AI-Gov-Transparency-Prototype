version = "0.1.0"
description = "Thailand government spending transparency data service and anomaly scoring MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "joblib>=1.4",
    "pandas>=2.2",
    "paddleocr>=3.2,<4",
    "paddlepaddle==3.2.0",
    "pdf2image>=1.17",
    "pypdf>=6.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]
